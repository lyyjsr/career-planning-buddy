name: career-planning-buddy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_buddy}
      POSTGRES_USER: ${POSTGRES_USER:-career_buddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_buddy_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${COMPOSE_APP_ENV:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career_buddy}:${POSTGRES_PASSWORD:-career_buddy_local}@postgres:5432/${POSTGRES_DB:-career_buddy}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}","http://127.0.0.1:${FRONTEND_PORT:-5173}"]'
      AGENT_GRAPH_VERSION: stage5-v1
      AGENT_FEATURE_STAGE: 5
      AGENT_DEADLINE_SECONDS: ${AGENT_DEADLINE_SECONDS:-120}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-2}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
      LLM_PROVIDER: ${COMPOSE_LLM_PROVIDER:-mock}
      LLM_API_KEY: ${COMPOSE_LLM_API_KEY:-}
      LLM_BASE_URL: ${COMPOSE_LLM_BASE_URL:-}
      LLM_MODEL: ${COMPOSE_LLM_MODEL:-}
      SEARCH_PROVIDER: mock
      EMBEDDING_PROVIDER: ${COMPOSE_EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL_PATH: ${COMPOSE_EMBEDDING_MODEL_PATH:-}
      EMBEDDING_MODEL_NAME: ${COMPOSE_EMBEDDING_MODEL_NAME:-}
      EMBEDDING_DIM: 1024
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
